<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>贪吃蛇大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1013;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;display:flex;gap:18px;font-size:15px;color:#9aa0a8;z-index:5;pointer-events:none}
.hud b{font-weight:600;color:#f2f3f5;font-variant-numeric:tabular-nums}
#pauseBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:14px;z-index:6;padding:6px 16px;font-size:14px;border-radius:8px;border:1px solid #333842;background:rgba(20,22,27,0.7);color:#f2f3f5;font-family:inherit}
.lb{position:fixed;top:calc(46px + env(safe-area-inset-top));right:14px;z-index:5;padding:6px 10px;border-radius:9px;background:rgba(20,22,27,0.62);border:1px solid #2a2f37;font-size:11px;line-height:18px;color:#9aa0a8;min-width:112px;pointer-events:none}
.lb .me{color:#f2f3f5;font-weight:600}
.lb .lbt{font-weight:600;color:#f2f3f5;margin-bottom:2px}
#joy{position:fixed;left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;border:1.5px solid #3a4048;background:rgba(255,255,255,0.05);z-index:6;touch-action:none}
#map{position:fixed;left:calc(20px + env(safe-area-inset-left));bottom:calc(146px + env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;border:1px solid #2a2f37;background:rgba(20,22,27,0.55);z-index:5;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3)}
#boostBtn{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:1.5px solid #3a4048;background:rgba(255,255,255,0.07);color:#f2f3f5;font-size:14px;font-family:inherit;z-index:6;touch-action:none}
#skillBtn{position:fixed;right:calc(110px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:1.5px solid #e3b341;background:rgba(227,179,65,0.15);color:#ffe08a;font-size:12px;font-family:inherit;z-index:6;touch-action:none}
#boostBtn.on{background:rgba(88,166,255,0.28);border-color:#58a6ff}
.ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;background:rgba(10,11,14,0.82);z-index:10;text-align:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ovl>*{flex-shrink:0}
.ovl>*:first-child{margin-top:auto}
.ovl>*:last-child{margin-bottom:auto}
.ovl h3{font-size:26px;font-weight:600;color:#f2f3f5}
.ovl p{font-size:15px;line-height:26px;color:#9aa0a8}
.btn{padding:12px 40px;border-radius:12px;border:1px solid #3a4048;background:#f2f3f5;color:#0e1013;font-size:17px;font-family:inherit}
#nameInput{padding:10px 16px;border-radius:10px;border:1px solid #3a4048;background:rgba(255,255,255,0.06);color:#f2f3f5;font-size:16px;font-family:inherit;text-align:center;width:220px;outline:none}
#colorRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:320px}
#colorRow .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 0.15s}
#colorRow .sw.on{border-color:#f2f3f5;transform:scale(1.15)}
#famRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:360px;align-items:center}
#famRow .fw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 0.15s;position:relative}
#famRow .fw.on{border-color:#f2f3f5;transform:scale(1.12)}
#famRow .fw span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;color:#0e1013;font-weight:600;pointer-events:none}
.tbtn{position:fixed;top:calc(8px + env(safe-area-inset-top));z-index:6;padding:6px 12px;font-size:13px;border-radius:8px;border:1px solid #333842;background:rgba(20,22,27,0.7);color:#f2f3f5;font-family:inherit}
#musBtn{right:158px}
#sfxBtn{right:86px}
#exitBtn{right:230px}
.btn2{background:transparent;color:#f2f3f5}
#lanInfo{font-size:13px;color:#9aa0a8;min-height:18px;line-height:22px}
#lanInfo input{padding:6px 10px;border-radius:8px;border:1px solid #3a4048;background:rgba(255,255,255,0.06);color:#f2f3f5;font-family:inherit;width:130px;outline:none}
#lanInfo button{padding:6px 14px;border-radius:8px;border:1px solid #3a4048;background:#f2f3f5;color:#0e1013;font-family:inherit}
.hs{width:260px;max-height:156px;overflow:auto;border:1px solid #2a2f37;border-radius:10px;padding:8px 12px;font-size:13px;color:#9aa0a8;text-align:left;background:rgba(20,22,27,0.5)}
.hs .t{font-weight:600;color:#f2f3f5;margin-bottom:4px;text-align:center}
.hs .r{display:flex;justify-content:space-between;line-height:22px}
.hs .cur{color:#58a6ff;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
<span>长度 <b id="hLen">0</b></span>
<span>击杀 <b id="hKill">0</b></span>
<span>存活 <b id="hTime">0s</b></span>
<span id="hFx" style="color:#e3b341"></span>
</div>
<button class="tbtn" id="musBtn">音乐·开</button>
<button class="tbtn" id="sfxBtn">音效·开</button>
<button class="tbtn" id="exitBtn">退出</button>
<button id="pauseBtn">暂停</button>
<div class="lb" id="lb"></div>
<canvas id="map" width="240" height="240"></canvas>
<button id="skillBtn" style="display:none">技能</button>
<div id="joy"><div id="joyKnob"></div></div>
<button id="boostBtn">加速</button>
<div class="ovl" id="ovl">
<h3>贪吃蛇大作战</h3>
<input id="nameInput" maxlength="8" placeholder="输入你的名字" autocomplete="off">
<div id="famRow"></div>
<div id="colorRow"></div>
<div id="hsPanel"></div>
<p>左手拖动左下角方向盘控制方向，右手按住右下角「加速」冲刺<br>长度 1000 解锁金色光环；长度 3000 且为全场第一名，进化彩虹神蛇（全场唯一）<br>局域网联机：一台平板「创建房间」，另一台输入它的 IP「加入房间」</p>
<button class="btn" id="startBtn">开始游戏</button>
<div style="display:flex;gap:10px">
<button class="btn btn2" id="hostBtn">创建房间</button>
<button class="btn btn2" id="joinBtn">加入房间</button>
</div>
<div id="lanInfo"></div>
<div id="verTag" style="position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;color:#5a626d;z-index:11"></div>
</div>
<div id="testlog" style="display:none"></div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var logEl=$('testlog');
var AUTO=!!window.__AUTOPILOT__;
function slog(m){if(logEl)logEl.textContent+=m+"\n";try{console.log(m);}catch(e){}}
window.addEventListener('error',function(e){slog('[ERR] '+e.message+' @'+(e.lineno||0));});
var C={text:'#f2f3f5',sub:'#9aa0a8',bg:'#0e1013',grid:'#8a919c',danger:'#ff7b72'};
var VERSION='3.2';
var SERIES=['#ff7b72','#3fb950','#d2a8ff','#9aa0a8','#58a6ff','#e3b341'];
var ME='#58a6ff';
var WORLD_R=2300,FOOD_N=170,AI_N=9,SP=5;
var W=0,H=0,DPR=1;
var needRender=true,cvRect=null,joyRect=null;
function resize(){DPR=Math.min(1.5,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);needRender=true;cvRect=null;joyRect=null;}
window.addEventListener('resize',resize);
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
var foods=[],snakes=[],player=null,tickN=0,paused=false,started=false,deaths=0,aliveTicks=0;
var powers=[],PWT=['mag','zm','x5','mush'];
var PWC={mag:'#ffd700',shd:'#58a6ff',zm:'#d2a8ff',x5:'#3fb950',mush:'#ff9ecf'};
var PWN={mag:'磁',shd:'盾',zm:'镜',x5:'×2',mush:'菇'};
function spawnPower(){var p=randPos(200);powers.push({x:p.x,y:p.y,r:10,type:PWT[(Math.random()*PWT.length)|0]});}
function applyPower(s,t){
if(t==='mush'){s.score+=500;(s.mushs=s.mushs||[]).push({t:tickN+900,v:500});}
else if(t==='mag')s.magT=tickN+600;
else if(t==='shd')s.shdT=tickN+480;
else if(t==='zm')s.zmT=tickN+600;
else if(t==='x5')s.x5T=tickN+480;
if(s.isPlayer)sfxPow();
}
function activateSkill(s){
if(!s.alive||(s.skillN||0)<=0||(s.fzT||0)>tickN)return false;
s.skillN--;s.fzT=tickN+480;s.zmT=Math.max(s.zmT||0,tickN+600);
if(s.isPlayer)sfxFrenzy();
return true;
}
var boostIds={},mouseBoost=false;
function randPos(margin){var a=rnd(0,Math.PI*2),r=rnd(0,WORLD_R-margin);return{x:Math.cos(a)*r,y:Math.sin(a)*r};}
function spawnFood(x,y,val){if(foods.length>=900)return;var p=(x===undefined)?randPos(120):{x:x,y:y};foods.push({x:p.x,y:p.y,r:rnd(2.5,4.5),v:val||1,c:SERIES[(Math.random()*SERIES.length)|0]});}
function clearOf(x,y,d){for(var k=0;k<snakes.length;k++){var s=snakes[k];if(!s.alive)continue;for(var i=0;i<s.pts.length;i+=4){if(dist(x,y,s.pts[i].x,s.pts[i].y)<d)return false;}}return true;}
function rad(s){return 4.5+Math.min(9,s.score*0.045);}
function zoomOf(s){var z=Math.max(0.65,1-Math.max(0,s.score-26)*0.0012);if((s.zmT||0)>tickN)z*=0.8;return z;}
var NAMES=['蛇王','大胃王','闪电','卷卷','小皮','奶糖','墨墨','豆豆','阿紫'];
var UID=1;
function mkSnake(name,color,isPlayer){
var s={name:name,color:color,isPlayer:!!isPlayer,pts:[],trail:[],aggro:rnd(0.2,0.6),vlen:26,angle:rnd(0,Math.PI*2),tAngle:0,score:26,kills:0,alive:true,boost:false,grace:150,aiT:0,aiA:rnd(0,Math.PI*2),respawn:0,deadT:0,tseq:0,snapFull:true,uid:UID++};
place(s);return s;
}
function farFromHumans(x,y,d){
for(var k=0;k<snakes.length;k++){var s=snakes[k];if((s.isPlayer||s.isHuman)&&s.alive&&s.pts.length){if(dist(x,y,s.pts[0].x,s.pts[0].y)<d)return false;}}
return true;
}
function place(s){
var p=null;
for(var i=0;i<50;i++){var c=randPos(500);if(clearOf(c.x,c.y,320)&&farFromHumans(c.x,c.y,1050)){p=c;break;}}
if(!p){for(var i3=0;i3<50;i3++){var c2=randPos(600);if(clearOf(c2.x,c2.y,320)){p=c2;break;}}}
if(!p)p=randPos(600);
s.pts=[];var n=Math.floor(s.score);
for(var i2=0;i2<n;i2++)s.pts.push({x:p.x-i2*SP*Math.cos(s.angle),y:p.y-i2*SP*Math.sin(s.angle)});
s.trail=s.pts.map(function(q){return{x:q.x,y:q.y};});
s.vlen=Math.floor(s.score);
s.bornT=tickN;
}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
var AC=null,sfxOn=true,musOn=true,combo=0,comboT=0,prevPBoost=false;
try{var ap=JSON.parse(localStorage.getItem('snake_audio')||'null');if(ap){sfxOn=ap.s!==false;musOn=ap.m!==false;}}catch(e){}
function saveAP(){try{localStorage.setItem('snake_audio',JSON.stringify({s:sfxOn,m:musOn}));}catch(e){}}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,dur,type,vol,dl,slide){if(!sfxOn)return;var c=ac();if(!c)return;var t=c.currentTime+(dl||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);}
function sfxEat(cb){var f=620+Math.min(cb,12)*35;tone(f,0.1,'sine',0.14);tone(f*2,0.07,'triangle',0.05,0.02);}
function sfxDie(){tone(320,0.6,'sawtooth',0.16,0,70);tone(160,0.7,'triangle',0.12,0.05,50);}
function sfxKill(){var n=[523,659,784,1046];for(var i=0;i<4;i++)tone(n[i],0.14,'triangle',0.13,i*0.07);}
function sfxStart(){var n=[392,523,659];for(var i=0;i<3;i++)tone(n[i],0.13,'triangle',0.12,i*0.08);}
function sfxBoost(){tone(200,0.18,'sine',0.05,0,480);}
function sfxPow(){tone(880,0.12,'triangle',0.14);tone(1174,0.14,'triangle',0.12,0.08);tone(1568,0.2,'sine',0.1,0.16);}
function sfxFrenzy(){var n=[523,659,784,1046,1318,1568];for(var i=0;i<6;i++)tone(n[i],0.12,'sawtooth',0.08,i*0.05);tone(392,0.5,'triangle',0.1,0.3,784);}
var CHORDS=[[48,[60,64,67]],[43,[59,62,67]],[45,[57,60,64]],[41,[57,60,65]],[48,[60,64,67]],[43,[59,62,67]],[41,[57,60,65]],[43,[59,62,67]]];
var PAT=[0,1,2,1,0,1,2,1];
var beat=60/112,musTimer=null,nextNoteT=0,mstep=0;
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function mnote(m,t,dur,type,vol){var c=AC;if(!c||!musOn)return;var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=mf(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);}
function musStart(){var c=ac();if(!c||musTimer)return;nextNoteT=c.currentTime+0.1;mstep=0;musTimer=setInterval(musTick,90);}
function musTick(){var c=AC;if(!c)return;
if(!musOn||paused||!started){nextNoteT=c.currentTime+0.1;return;}
if(nextNoteT<c.currentTime-0.5)nextNoteT=c.currentTime+0.05;
while(nextNoteT<c.currentTime+0.25){schedStep(mstep,nextNoteT);nextNoteT+=beat/2;mstep=(mstep+1)%64;}}
function schedStep(st,t){var bar=(st/8)|0,pos=st%8;var ch=CHORDS[bar];
if(pos===0)mnote(ch[0],t,beat*1.6,'sine',0.075);
if(pos===4)mnote(ch[0]+7,t,beat*0.5,'sine',0.05);
mnote(ch[1][PAT[pos]]+((bar%2===1&&pos===6)?12:0),t,beat*0.42,'triangle',0.045);}
var HS_MEM=[];
function loadHS(){try{var a=JSON.parse(localStorage.getItem('snake_hs')||'[]');return Array.isArray(a)?a:[];}catch(e){return HS_MEM;}}
function saveHS(a){HS_MEM=a;try{localStorage.setItem('snake_hs',JSON.stringify(a));}catch(e){}}
function recordScore(){var e={n:player.name,s:Math.floor(player.score),k:player.kills,t:Math.floor(aliveTicks/60),d:Date.now()+Math.random()};var a=loadHS();a.push(e);a.sort(function(x,y){return y.s-x.s;});a=a.slice(0,10);saveHS(a);return{a:a,id:e.d};}
function esc(s){return String(s).replace(/[<>&"]/g,'');}
function hsListHTML(a,curId){if(!a.length)return '';var h='<div class="hs"><div class="t">历史最高分 TOP '+a.length+'</div>';for(var i=0;i<a.length;i++){var e=a[i];h+='<div class="r'+(e.d===curId?' cur':'')+'"><span>'+(i+1)+'. '+esc(e.n)+'</span><span>'+e.s+'</span></div>';}return h+'</div>';}
var LAN={mode:0,snapSent:0,snapRecv:0,ownIdx:-1,cSnakes:[],cFoods:[],entered:false,pendingJoin:false,sentSeq:{}};
var ownHist=[];
var remotes={},startHTML='';
function lanSend(o){var s=JSON.stringify(o);if(window.Android&&Android.lanSend){try{Android.lanSend(s);}catch(e){}}else if(window.parent&&window.parent!==window){try{window.parent.postMessage({lan:1,msg:s},'*');}catch(e){}}}
function lanSendTo(cid,o){cid=parseInt(cid,10);var s=JSON.stringify(o);if(window.Android&&Android.lanSendTo){try{Android.lanSendTo(cid,s);}catch(e){}}else if(window.parent&&window.parent!==window){try{window.parent.postMessage({lan:1,to:cid,msg:s},'*');}catch(e){}}}
window.__lanOnMsg=function(id,s){var m;try{m=JSON.parse(s);}catch(e){return;}try{lanOnMsg(id,m);}catch(e){slog('[ERR] lan '+(e&&e.message));}};
window.addEventListener('message',function(e){if(e.data&&e.data.lan)window.__lanOnMsg(e.data.from||0,e.data.msg);});
window.__lanPeer=function(id,joined){
if(LAN.mode!==1)return;
if(!joined){var rs=remotes[id];if(rs){var ix=snakes.indexOf(rs);if(ix>=0)snakes.splice(ix,1);delete remotes[id];}delete LAN.sentSeq[id];}
var li=$('lanInfo');if(li&&!started)li.textContent='已加入 '+Object.keys(remotes).length+' 人，点「开始游戏」开局！';
};
window.__lanStatus=function(s){
var li=$('lanInfo');
if(s.indexOf('listening')===0){var ip=s.split('=')[1]||'';if(li)li.textContent='房间已创建，你的IP：'+ip+'，让朋友输入后加入；也可以直接点「开始游戏」';}
else if(s==='connected'){
if(LAN.mode===1){if(li)li.textContent='已加入 '+Object.keys(remotes).length+' 人，点「开始游戏」开局！';}
else if(LAN.mode===2){if(li)li.textContent='已连接主机，等待开局…';lanSend({t:'hello',n:player.name,c:player.color});}
}
else if(s.indexOf('error')===0){if(li)li.textContent='连接失败：'+s;}
else if(s==='closed'){if(li)li.textContent='连接已断开';}
};
function lanHostRoom(){
var nm=($('nameInput').value||'').trim();if(nm)player.name=nm;
player.color=pColor;
LAN.mode=1;
var li=$('lanInfo');if(li)li.textContent='正在创建房间…';
if(window.Android&&Android.lanHost){try{Android.lanHost(7799);}catch(e){if(li)li.textContent='创建失败';}}
else{window.__lanStatus('listening ip=10.0.0.1');setTimeout(function(){window.__lanStatus('connected');},400);}
}
function lanJoinRoom(){
var li=$('lanInfo');if(!li)return;
li.innerHTML='请先在上方设置好名字和颜色<br>主机IP：<input id="ipInput" value="192.168."> <button id="connBtn">确认加入</button>';
$('connBtn').onclick=function(){
var ip=($('ipInput').value||'').trim();if(!ip)return;
var nm2=($('nameInput').value||'').trim();if(nm2)player.name=nm2;
player.color=pColor;
LAN.mode=2;li.textContent='正在连接 '+ip+' …';
if(window.Android&&Android.lanJoin){try{Android.lanJoin(ip,7799);}catch(e){li.textContent='连接失败';}}
else{window.__lanStatus('connected');}
};
}
function lanOnMsg(id,m){
if(m.t==='hello'&&LAN.mode===1){
var rs=remotes[id];
if(!rs){rs=mkSnake(m.n||'玩家'+(id+1),m.c||'#ff7b72',false);rs.remote=true;rs.isHuman=true;snakes.push(rs);remotes[id]=rs;}
else{rs.name=m.n||rs.name;rs.color=m.c||rs.color;}
LAN.sentSeq[id]={};
fixColorConflicts();
lanSendTo(id,{t:'you',i:snakes.indexOf(rs)});
if(started)lanSendTo(id,{t:'start'});
var li=$('lanInfo');if(li&&!started)li.textContent='已加入 '+Object.keys(remotes).length+' 人，点「开始游戏」开局！';
}

function aiThink(s){

}
var want=s.aiA+rnd(-0.2,0.2);

for(k=0;k<snakes.length;k++){
var o2=snakes[k];if(o2===s||!o2.alive)continue;

var dx2=oh2.x-h.x,dy2=oh2.y-h.y,d2=dx2*dx2+dy2*dy2;
if(o2.score>s.score*1.3&&d2<nbd){nbd=d2;nb=oh2;}
if(o2.score<s.score*0.7&&d2<nsd){nsd=d2;ns=o2;}
}
if(nb){want=Math.atan2(h.y-nb.y,h.x-nb.x);}

var nsh=ns.pts[0];

want=Math.atan2(nsh.y+Math.sin(ns.angle)*lead-h.y,nsh.x+Math.cos(ns.angle)*lead-h.x);
}else{
var bf=null,bd=900*900;
for(var i=0;i<foods.length;i++){var f=foods[i];var dx=f.x-h.x,dy=f.y-h.y,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bf=f;}}
if(bf)want=Math.atan2(bf.y-h.y,bf.x-h.x);
}
var dc=Math.hypot(h.x,h.y);
if(dc>WORLD_R-320)want=Math.atan2(-h.y,-h.x)+rnd(-0.3,0.3);
var best=want,bestScore=-1e9;
for(var c=-4;c<=4;c++){
var ang=want+c*0.35;

var px2=h.x+Math.cos(ang)*look,py2=h.y+Math.sin(ang)*look;

var align=Math.cos(norm(ang-want))*40;
var persist=Math.cos(norm(ang-s.angle))*30;
var sc=align+persist-danger;
if(Math.abs(norm(ang-s.angle))>2.0)sc-=250;
if(sc>bestScore){bestScore=sc;best=ang;}
}
s.aiA=best;
s.boost=(bestScore>-25&&Math.random()<0.015)||(nb&&nbd<130*130);

// 由蛇头轨迹按恒定弧长重建蛇身(主机与客机共用同一算法, 保证渲染一致)
function rebuildBody(s){
if(!s.trail.length)return;
if(s.vlen===undefined)s.vlen=s.score;
if(s.score>s.vlen){var gr=Math.max(0.35,(s.score-s.vlen)*0.03);s.vlen=Math.min(s.score,s.vlen+gr);}
else if(s.score<s.vlen)s.vlen=Math.max(s.score,s.vlen-Math.max(0.6,(s.vlen-s.score)*0.05));
var targetPx=Math.max(12,s.vlen)*SP;
var pts=s.pts;
if(!pts.length&&s.trail.length)pts.push({x:s.trail[0].x,y:s.trail[0].y});
var dW=0,ti=0,pi=1;
var ax=s.trail[0].x,ay=s.trail[0].y;
while(pi*SP<=targetPx+0.001&&ti<s.trail.length-1){
var bx=s.trail[ti+1].x,by=s.trail[ti+1].y;
var seg=Math.hypot(bx-ax,by-ay);
if(seg<0.0001){ti++;continue;}
var nd=pi*SP-dW;
if(seg>=nd){
var t=nd/seg;
ax=ax+(bx-ax)*t;ay=ay+(by-ay)*t;
if(pts[pi]){pts[pi].x=ax;pts[pi].y=ay;}else pts.push({x:ax,y:ay});
pi++;dW=(pi-1)*SP;
}else{dW+=seg;ax=bx;ay=by;ti++;}
}
var fd=targetPx-(pi-1)*SP;
if(fd>0.5&&ti<s.trail.length-1){
var nd2=targetPx-dW;
while(ti<s.trail.length-1){
var bx2=s.trail[ti+1].x,by2=s.trail[ti+1].y;
var seg2=Math.hypot(bx2-ax,by2-ay);
if(seg2<0.0001){ti++;continue;}
if(seg2>=nd2){var t2=nd2/seg2;var fx2=ax+(bx2-ax)*t2,fy2=ay+(by2-ay)*t2;
if(pts[pi]){pts[pi].x=fx2;pts[pi].y=fy2;}else pts.push({x:fx2,y:fy2});
pi++;break;
}else{nd2-=seg2;ax=bx2;ay=by2;ti++;}
}
}
var lt=s.trail[s.trail.length-1];
var minLen=Math.max(12,Math.floor(s.vlen));
s.__pile=Math.max(0,minLen-pi);
while(pi<minLen){if(pts[pi]){pts[pi].x=lt.x;pts[pi].y=lt.y;}else pts.push({x:lt.x,y:lt.y});pi++;}
while(pts.length>pi)pts.pop();
while(s.trail.length>s.vlen*2+70)s.trail.pop();
}

{n:'粉',shades:['#ffc4e0','#ff9ecf','#e0559f']},
{n:'灰',shades:['#f2f3f5','#c9cfd6','#8b929b']}];
var PCOLORS=[];
COLFAMS.forEach(function(f){f.shades.forEach(function(c){PCOLORS.push(c);});});
var pColor=COLFAMS[0].shades[1],pFam=0;
function aiColorFree(){
var used={};
used[player?player.color:'']=1;
for(var i=0;i<snakes.length;i++){var s=snakes[i];if(!s.isPlayer&&s.alive)used[s.color]=1;}
var free=PCOLORS.filter(function(c){return !used[c];});
if(!free.length)free=PCOLORS;
return free[(Math.random()*free.length)|0];
}
function fixColorConflicts(){
var seen={};
seen[player.color]=1;
for(var c1 in remotes)seen[remotes[c1].color]=1;
for(var i=0;i<snakes.length;i++){
var s=snakes[i];
if(s.isPlayer||s.remote)continue;
if(seen[s.color])s.color=aiColorFree();
seen[s.color]=1;
}
}
function bindStartUI(){
var fam=$('famRow');fam.innerHTML='';
COLFAMS.forEach(function(f,fi){
var b=document.createElement('div');
b.className='fw'+(fi===pFam?' on':'');
b.style.background=f.shades[1];
b.innerHTML='<span>'+f.n+'</span>';
b.onclick=function(){pFam=fi;pColor=f.shades[1];var all=fam.children;for(var i2=0;i2<all.length;i2++)all[i2].className='fw';b.className='fw on';fillShades();};
fam.appendChild(b);
});
function fillShades(){
var row=$('colorRow');row.innerHTML='';
COLFAMS[pFam].shades.forEach(function(c){
var b=document.createElement('div');
b.className='sw'+(c===pColor?' on':'');
b.style.background=c;
b.onclick=function(){pColor=c;var all=row.children;for(var i2=0;i2<all.length;i2++)all[i2].className='sw';b.className='sw on';};
row.appendChild(b);
});
}
fillShades();
$('hsPanel').innerHTML=hsListHTML(loadHS(),0);
var vt=$('verTag');if(vt)vt.textContent='版本 v'+VERSION;
var li=$('lanInfo');if(li)li.textContent='';
$('startBtn').onclick=function(){
var nm=($('nameInput').value||'').trim();
if(nm)player.name=nm;
player.color=pColor;
started=true;$('ovl').style.display='none';
fixColorConflicts();
ac();musStart();sfxStart();
if(LAN.mode===1)lanSend({t:'start'});
};
$('hostBtn').onclick=lanHostRoom;
$('joinBtn').onclick=lanJoinRoom;
}
function refreshTgl(){$('musBtn').textContent='音乐·'+(musOn?'开':'关');$('sfxBtn').textContent='音效·'+(sfxOn?'开':'关');}
$('musBtn').onclick=function(){musOn=!musOn;saveAP();refreshTgl();if(musOn){ac();musStart();}};
$('sfxBtn').onclick=function(){sfxOn=!sfxOn;saveAP();refreshTgl();};
refreshTgl();
function showMenu(){
if(LAN.mode&&window.Android&&Android.lanStop){try{Android.lanStop();}catch(e){}}
LAN.mode=0;remotes={};LAN.entered=false;LAN.ownIdx=-1;LAN.cSnakes=[];
paused=false;started=false;$('pauseBtn').textContent='暂停';
var o=$('ovl');o.innerHTML=startHTML;o.style.display='flex';
bindStartUI();
}
$('exitBtn').onclick=function(){
if(!started)return;
paused=true;$('pauseBtn').textContent='继续';
var o=$('ovl');o.style.display='flex';
o.innerHTML='<h3>退出游戏</h3><p>当前进度将保留在本局，要做什么？</p><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn" id="menuBtn">回到主菜单</button><button class="btn btn2" id="quitBtn">退出游戏</button><button class="btn btn2" id="cancelBtn">继续游戏</button></div>';
$('menuBtn').onclick=function(){showMenu();};
$('quitBtn').onclick=function(){if(window.Android&&Android.exitApp){try{Android.exitApp();}catch(e){}showMenu();}else{showMenu();}};
$('cancelBtn').onclick=function(){o.style.display='none';paused=false;$('pauseBtn').textContent='暂停';};
};
function setTarget(cx,cy){if(!player||!player.alive)return;player.tAngle=Math.atan2(cy-H/2,cx-W/2);}
cv.addEventListener('pointermove',function(e){setTarget(e.clientX,e.clientY);});
var bb=$('boostBtn');
$('skillBtn').addEventListener('pointerdown',function(e){e.preventDefault();if(!player||!player.alive)return;if(activateSkill(player)&&LAN.mode===2)lanSend({t:'sk'});});
function updB(){var held=Object.keys(boostIds).length>0;if(player&&!AUTO)player.boost=held||mouseBoost;bb.className=held?'on':'';}
cv.addEventListener('pointerdown',function(e){setTarget(e.clientX,e.clientY);if(e.pointerType==='mouse'){mouseBoost=true;updB();}});
window.addEventListener('pointerup',function(e){if(e.pointerType==='mouse')mouseBoost=false;delete boostIds[e.pointerId];updB();});
window.addEventListener('pointercancel',function(e){if(e.pointerType==='mouse')mouseBoost=false;delete boostIds[e.pointerId];updB();});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
bb.addEventListener('pointerdown',function(e){e.preventDefault();boostIds[e.pointerId]=1;try{bb.setPointerCapture(e.pointerId);}catch(err){}updB();});
bb.addEventListener('pointerup',function(e){delete boostIds[e.pointerId];updB();});
bb.addEventListener('pointercancel',function(e){delete boostIds[e.pointerId];updB();});
var joy=$('joy'),knob=$('joyKnob'),joyId=null;
function joyVec(e){
var r=joyRect||(joyRect=joy.getBoundingClientRect());
var cx=r.left+r.width/2,cy=r.top+r.height/2;
var dx=e.clientX-cx,dy=e.clientY-cy;
var d=Math.hypot(dx,dy)||1;
var m=Math.min(d,42);
knob.style.transform='translate('+(dx/d*m)+'px,'+(dy/d*m)+'px)';
if(player&&d>6)player.tAngle=Math.atan2(dy,dx);
}
function joyReset(e){if(joyId===null)return;joyId=null;knob.style.transform='translate(0px,0px)';}
joy.addEventListener('pointerdown',function(e){e.preventDefault();joyId=e.pointerId;joyRect=joy.getBoundingClientRect();try{joy.setPointerCapture(e.pointerId);}catch(err){}joyVec(e);});
joy.addEventListener('pointermove',function(e){if(e.pointerId===joyId)joyVec(e);});
joy.addEventListener('pointerup',joyReset);
joy.addEventListener('pointercancel',joyReset);
document.addEventListener('visibilitychange',function(){if(document.hidden&&started&&!paused)togglePause();});
var rafOn=false,fbOn=false,lastTk=0,lastRaf=0;
function frame(now){
if(fbOn)return;
rafOn=true;lastRaf=now;
var ticked=false;
if(!lastTk||now-lastTk>=15){lastTk=now;ticked=true;try{tick();}catch(e){slog('[ERR] '+(e&&e.message));}}
if(ticked||needRender){needRender=false;try{render();}catch(e){slog('[ERR] '+(e&&e.message));}}
requestAnimationFrame(frame);
}
function loop(){
fbOn=true;
try{tick();render();}catch(e){slog('[ERR] '+(e&&e.message));}
setTimeout(loop,16);
}
setInterval(function(){
if(fbOn)return;
if(!rafOn||(performance.now()-lastRaf>300))loop();
},300);
function init(){
resize();
for(var i=0;i<FOOD_N;i++)spawnFood();
for(var pi2=0;pi2<3;pi2++)spawnPower();
player=mkSnake('我',ME,true);
snakes.push(player);
for(var i2=0;i2<AI_N;i2++){var ai=mkSnake(NAMES[i2%NAMES.length],aiColorFree(),false);if(i2<2){ai.score=110+i2*70;place(ai);}snakes.push(ai);}
updateHUD();
bindStartUI();
startHTML=$('ovl').innerHTML;
if(AUTO||window.__EATTEST__){started=true;$('ovl').style.display='none';slog('[TEST] boot ok, snakes='+snakes.length+' foods='+foods.length);try{localStorage.setItem('__t','1');localStorage.removeItem('__t');slog('[TEST] ls=ok');}catch(e){slog('[TEST] ls=blocked');}ac();musStart();}
if(window.__FORCE_FB__){loop();}else{try{requestAnimationFrame(frame);}catch(e){}}
setTimeout(function(){if(!rafOn&&!fbOn)loop();},600);
}
init();
})();
</script>
