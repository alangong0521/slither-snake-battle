<!DOCTYPE html><html><body>
<div id="log" style="display:none"></div>
<iframe id="A" name="F0" src="__FB_PATH__" width="400" height="260"></iframe>
<iframe id="B" name="F1" src="__FB_PATH__" width="400" height="260"></iframe>
<iframe id="C" name="F2" src="__FB_PATH__" width="400" height="260"></iframe>
<script>
// 三人联机仿真: A=主机 B/C=客机, 父页面做消息中继(模拟 TCP 桥)
var frames={0:document.getElementById('A'),1:document.getElementById('B'),2:document.getElementById('C')};
function slog(s){document.getElementById('log').textContent+=s+'\n';console.log(s);}
function idOf(w){if(w===frames[0].contentWindow)return 0;if(w===frames[1].contentWindow)return 1;if(w===frames[2].contentWindow)return 2;return -1;}
// 抖动/合批模式: 模拟真机WiFi突发到达+Java读线程合批, 消息缓冲150ms后按批注入__lanOnMsgs
var jbuf={}; // key=to, val=[{from,msg}]
function jflush(){
  for(var k in jbuf){var arr=jbuf[k];delete jbuf[k];if(!arr.length)continue;
    var to=Math.floor(k/10),from=k%10;
    var f=frames[to];if(!f)continue;
    var parsed=[];for(var q=0;q<arr.length;q++){try{parsed.push(JSON.parse(arr[q].msg));}catch(e){}}
    try{f.contentWindow.__lanOnMsgs(from,parsed);}catch(e){slog('[SIM] jflush err '+e.message);}
  }
}
setInterval(jflush,150);
window.addEventListener('message',function(e){
  if(!(e.data&&e.data.lan))return;
  var sid=idOf(e.source);if(sid<0)return;
  var out={lan:1,from:sid,msg:e.data.msg};
  function deliver(to){
    if(e.data.msg.indexOf('"t":"you"')>=0||e.data.msg.indexOf('"t":"hello"')>=0)slog('[SIM] relay '+e.data.msg.slice(0,60)+' to='+to);
    if(window.__jitter){var kk=to*10+sid;(jbuf[kk]=jbuf[kk]||[]).push({msg:e.data.msg});}
    else{var f=frames[to];if(f)f.contentWindow.postMessage(out,'*');}
  }
  if(sid===0){
    if(window.__dropB&&e.data.to===1)return; // 模拟丢包(快照断档测试)
    if(window.__dropBAll&&e.data.to===1)return; // 模拟彻底断线(看门狗测试)
    if(e.data.to!==undefined)deliver(e.data.to);
    else{deliver(1);deliver(2);}
  }else{
    if(window.__jitter){var kk2=sid;(jbuf[kk2]=jbuf[kk2]||[]).push({msg:e.data.msg});}
    else frames[0].contentWindow.postMessage(out,'*');
  }
});
var t0=Date.now();
function clickJoin(fid,name,done){
  try{
    var w=frames[fid].contentWindow;
    var ni=w.document.getElementById('nameInput');var jb=w.document.getElementById('joinBtn');
    if(!ni||!jb)return false;
    ni.value=name;jb.click();
    setTimeout(function(){try{var ip=w.document.getElementById('ipInput');var cb=w.document.getElementById('connBtn');if(!ip||!cb){done.v=false;return;}ip.value='10.0.0.1';cb.click();slog('[SIM] '+name+' join clicked');}catch(e){done.v=false;}},400);
    return true;
  }catch(e){return false;}
}
function step(){
  var t=(Date.now()-t0)/1000;
  try{
    if(t>1&&!window.__s1){try{var aw=frames[0].contentWindow;var ni=aw.document.getElementById('nameInput');var hb=aw.document.getElementById('hostBtn');if(ni&&hb){window.__s1=1;ni.value='主机';hb.click();slog('[SIM] A host clicked');}}catch(e){}}
    if(t>2.5&&!window.__s2){window.__d2=window.__d2||{v:true};if(clickJoin(1,'客机B',window.__d2)&&window.__d2.v)window.__s2=1;}
    if(t>4&&!window.__s3){window.__d3=window.__d3||{v:true};if(clickJoin(2,'客机C',window.__d3)&&window.__d3.v)window.__s3=1;}
    if(t>6&&!window.__s4){try{var sb=frames[0].contentWindow.document.getElementById('startBtn');if(sb){window.__s4=1;sb.click();slog('[SIM] A start clicked');}}catch(e){}}
    if(t>8&&!window.__s5){window.__s5=1;
      for(var i=1;i<=2;i++){var w=frames[i].contentWindow;slog('[SIM] client'+i+' autoEntered='+w.__G.LAN.entered);}
    }
    if(t>5.5&&!window.__sJ1){window.__sJ1=1;window.__jitter=true;
      window.__jReb0=frames[1].contentWindow.__G.LAN.rebases||0;
      window.__jTp0=frames[1].contentWindow.__G.LAN.teleports||0;
      slog('[SIM] jitter on (合批投递150ms)');}
    if(t>10.6&&!window.__sJ2){window.__sJ2=1;window.__jitter=false;
      var bwj=frames[1].contentWindow;
      slog('[SIM] jitter off. B jitterRebases='+((bwj.__G.LAN.rebases||0)-window.__jReb0)+' gaps='+(bwj.__G.LAN.gaps||0)+' teleports='+((bwj.__G.LAN.teleports||0)-window.__jTp0));}
    if(t>9&&!window.__s6){window.__s6=1;
      var aw=frames[0].contentWindow,bw=frames[1].contentWindow,cw=frames[2].contentWindow;
      slog('[SIM] A snakes='+aw.__G.snakes.length+' remotes='+Object.keys(aw.__G.remotes).length+' snapsSent='+aw.__G.LAN.snapSent);
      slog('[SIM] B ownIdx='+bw.__G.LAN.ownIdx+' snakes='+bw.__G.snakes.length+' snaps='+bw.__G.LAN.snapRecv+' alive='+(bw.__G.player.alive?1:0));
      slog('[SIM] C ownIdx='+cw.__G.LAN.ownIdx+' snakes='+cw.__G.snakes.length+' snaps='+cw.__G.LAN.snapRecv+' alive='+(cw.__G.player.alive?1:0)+' name='+cw.__G.player.name);
      window.__cColor=cw.__G.player.color;
      var names=['A','B','C'];
      for(var fi=0;fi<3;fi++){var w2=frames[fi].contentWindow;
        var info='';for(var si=0;si<w2.__G.snakes.length;si++){var sn=w2.__G.snakes[si];if(sn.isHuman||sn.isPlayer)info+=' '+sn.name+':'+sn.pts.length+'pt@'+Math.round(sn.pts[0]?sn.pts[0].x:-999)+','+Math.round(sn.pts[0]?sn.pts[0].y:-999)+(sn.alive?'':'(死)');}
        slog('[SIM] '+names[fi]+' humans:'+info);
      }
    }
    if(t>9.5&&!window.__s65){window.__s65=1;
      var cw2=frames[2].contentWindow,aw2=frames[0].contentWindow;
      var cHost=aw2.__G.remotes[2]; // 以主机视角中C蛇的头为准(快照同步以它为中心)
      var ks=null;for(var i2=0;i2<aw2.__G.snakes.length;i2++){var s=aw2.__G.snakes[i2];if(s.alive&&!s.isPlayer&&!s.remote){ks=s;break;}}
      if(ks&&cHost&&cHost.pts&&cHost.pts.length){
        var kh={x:cHost.pts[0].x+150,y:cHost.pts[0].y};
        ks.grace=0;ks.pts=[];for(var ki=0;ki<600;ki++)ks.pts.push({x:kh.x+ki*0.6,y:kh.y+Math.sin(ki*0.05)*80});
        ks.trail=ks.pts.map(function(q){return{x:q.x,y:q.y};});ks.vlen=600;
        aw2.__G.die(ks,aw2.__G.player);
        slog('[SIM] forced kill near C, host foods='+aw2.__G.foods.length);
      }else slog('[SIM] kill setup failed');
    }
    if(t>7.5&&!window.__s7b){window.__s7b=1;
      var cwX=frames[2].contentWindow;
      slog('[SIM] C probe tickN='+cwX.__G.tickN+' paused='+(cwX.__G.paused?1:0)+' entered='+(cwX.__G.LAN.entered?1:0)+' hbLogged='+(cwX.__G.LAN.__hbLogged?1:0)+' snaps='+cwX.__G.LAN.snapRecv);
    }
    if(t>10.5&&!window.__s7){window.__s7=1;
      var cw3=frames[2].contentWindow;
      var ch=cw3.__G.player.pts[0];
      var near=0;for(var i=0;i<cw3.__G.foods.length;i++){var f=cw3.__G.foods[i];if(Math.abs(f.x-ch.x)<500&&Math.abs(f.y-ch.y)<320)near++;}
      slog('[SIM] C foods='+cw3.__G.foods.length+' nearC='+near+' C snaps='+cw3.__G.LAN.snapRecv+' C alive='+(cw3.__G.player.alive?1:0));
      var tw=0;for(var ti=0;ti<cw3.__G.foods.length;ti++){if(cw3.__G.foods[ti].tx!==undefined)tw++;}
      slog('[SIM] C ftween='+tw);
      slog('[SIM] B snaps='+frames[1].contentWindow.__G.LAN.snapRecv);
    }
    if(t>12.3&&!window.__s79){
      var bw4=frames[1].contentWindow;var rs0=bw4.__G.snakes[0];
      var mx=0,bad=0;if(rs0&&rs0.pts.length>6){var rEnd=rs0.pts.length-((rs0.__pile||0)+3);for(var ri=4;ri<rEnd;ri++){var dd=Math.hypot(rs0.pts[ri].x-rs0.pts[ri-1].x,rs0.pts[ri].y-rs0.pts[ri-1].y);var e2=Math.abs(dd-5);if(e2>mx)mx=e2;if(e2>3)bad++;}}
      // 恰遇重同步/吃尸体长度追赶的过渡帧会误报, 1秒内最多复测4次取最好成绩(稳态间距才是指标)
      if((bad>2||mx>5.0)&&(window.__s79r||0)<3){window.__s79r=(window.__s79r||0)+1;
      if(!window.__s79b||bad<window.__s79b.bad){window.__s79b={mx:mx,bad:bad,pts:rs0?rs0.pts.length:-1};}}
      else{window.__s79=1;if(window.__s79b&&(bad>2||mx>5.0)){mx=window.__s79b.mx;bad=window.__s79b.bad;}
slog('[SIM] B remoteSpacing maxErr='+mx.toFixed(2)+' bad='+bad+' pts='+(rs0?rs0.pts.length:-1));
if(bad>=2&&rs0){var bi2=[];for(var ri2=1;ri2<rs0.pts.length&&bi2.length<10;ri2++){var dd2=Math.hypot(rs0.pts[ri2].x-rs0.pts[ri2-1].x,rs0.pts[ri2].y-rs0.pts[ri2-1].y);if(Math.abs(dd2-5)>3)bi2.push(ri2+':'+dd2.toFixed(1));}
slog('[S79] badAt='+bi2.join(' ')+' pile='+(rs0.__pile||0)+' vlen='+Math.round(rs0.vlen)+' score='+Math.round(rs0.score)+' trailN='+rs0.trail.length+' rebases='+bw4.__G.LAN.rebases+' predN='+(rs0.predN||0));}}
    }
    if(t>11.8&&!window.__s80){window.__s80=1;
      var aw3=frames[0].contentWindow,cw4=frames[2].contentWindow;
      var cs=aw3.__G.remotes[2];
      if(cs&&cs.alive){aw3.__G.die(cs,aw3.__G.player);slog('[SIM] C killed by host, score was '+Math.round(cs.score));}
      setTimeout(function(){try{cw4.__G.lanSend({t:'rv'});slog('[SIM] C sent revive');}catch(e){slog('[SIM] rv err '+e.message);}},300);
    }
    if(t>13.2&&!window.__s81){window.__s81=1;
      var bw5=frames[1].contentWindow,cw5=frames[2].contentWindow;
      var bC=null,cC=null;for(var si=0;si<bw5.__G.snakes.length;si++){if(bw5.__G.snakes[si].name==='客机C')bC=bw5.__G.snakes[si];}
      for(var si2=0;si2<cw5.__G.snakes.length;si2++){if(cw5.__G.snakes[si2].name==='客机C')cC=cw5.__G.snakes[si2];}
      slog('[SIM] respawnReset BcPts='+(bC?bC.pts.length:-1)+' CcPts='+(cC?cC.pts.length:-1)+' BcScore='+(bC?Math.round(bC.score):-1));
      slog('[SIM] C colorSame='+(cw5.__G.player.color===window.__cColor?1:0)+' color='+cw5.__G.player.color);
    }
    if(t>13.55&&!window.__s82b){window.__s82b=1;
      // T41: 击杀客机B的蛇(主机权威), 验证B端立即定格+弹阵亡
      var aw4=frames[0].contentWindow,bw3=frames[1].contentWindow;
      var bRem=aw4.__G.remotes[1];
      if(bRem&&bRem.alive){aw4.__G.die(bRem,aw4.__G.player);slog('[SIM] B killed by host');}
      // T42: 主机移除一条AI蛇→下标漂移, 验证C端仍按uid认对自己的蛇
      aw4.__G.snakes.splice(2,1);slog('[SIM] host AI snake removed (index shift)');
      window.__bHead0={x:bw3.__G.player.pts[0].x,y:bw3.__G.player.pts[0].y};
    }
    if(t>14.15&&!window.__s83b){window.__s83b=1;
      var bw9=frames[1].contentWindow,cw6=frames[2].contentWindow;
      // 死亡快照到达需1-2帧, 冻结测量从本时刻开始(取第二窗口)
      window.__bHead1={x:bw9.__G.player.pts[0].x,y:bw9.__G.player.pts[0].y,alive:bw9.__G.player.alive};
      slog('[SIM] C ownIdx2='+cw6.__G.LAN.ownIdx+' ownOk='+(cw6.__G.player.name==='客机C'&&cw6.__G.player.isPlayer?1:0));
    }
    if(t>14.9&&!window.__s83c){window.__s83c=1;
      var bwA=frames[1].contentWindow;
      var bh2=bwA.__G.player.pts[0];
      var frozen2=Math.hypot(bh2.x-window.__bHead1.x,bh2.y-window.__bHead1.y)<2;
      var ovB=bwA.document.getElementById('ovl');
      slog('[SIM] B deadFrozen alive='+(bwA.__G.player.alive?1:0)+' frozen='+(frozen2?1:0)+' ovl='+(ovB&&ovB.innerHTML.indexOf('阵亡')>=0?1:0));
    }
    if(t>13.8&&!window.__s82){window.__s82=1;
      var bw6=frames[1].contentWindow;
      slog('[SIM] B noFReset='+(bw6.__G.LAN.noFReset||0)+' corrN='+(bw6.__G.LAN.corrN||0)+' corrSkip='+(bw6.__G.LAN.corrSkip||0));
    }
    if(t>14.2&&!window.__s75){window.__s75=1;
      frames[1].contentWindow.document.getElementById('pauseBtn').click();
      window.__tk0=frames[0].contentWindow.__G.tickN;
      slog('[SIM] B clicked pause');
    }
    if(t>15.5&&!window.__s76){window.__s76=1;
      var pA=frames[0].contentWindow.__G.paused,pB=frames[1].contentWindow.__G.paused,pC=frames[2].contentWindow.__G.paused;
      var tkA=frames[0].contentWindow.__G.tickN,tkC=frames[2].contentWindow.__G.tickN;
      window.__tkC0=tkC;
      slog('[SIM] pauseSync paused A/B/C='+pA+'/'+pB+'/'+pC+' tickAfrozen='+(tkA-window.__tk0<=1));
    }
    if(t>16.8&&!window.__s77){window.__s77=1;
      frames[2].contentWindow.document.getElementById('pauseBtn').click();
      slog('[SIM] C clicked resume');
    }
    if(t>18.2&&!window.__s78){window.__s78=1;
      var pA2=frames[0].contentWindow.__G.paused,pB2=frames[1].contentWindow.__G.paused,pC2=frames[2].contentWindow.__G.paused;
      var tkC2=frames[2].contentWindow.__G.tickN;
      slog('[SIM] resumeSync paused A/B/C='+pA2+'/'+pB2+'/'+pC2+' tickCresumed='+(tkC2-window.__tkC0>10));
    }
    if(t>18.8&&!window.__s83){window.__s83=1;window.__dropB=true;slog('[SIM] drop snaps to B 0.8s');}
    if(t>19.6&&!window.__s84){window.__s84=1;window.__dropB=false;slog('[SIM] resume snaps to B');}
    if(t>20.0&&!window.__s85){window.__s85=1;
      var bw7=frames[1].contentWindow;
      slog('[SIM] B gaps='+bw7.__G.LAN.gaps+' rebases='+bw7.__G.LAN.rebases);
    }
    if(t>20.4&&!window.__s86){window.__s86=1;window.__dropBAll=true;slog('[SIM] full drop to B (断线)');}
    if(t>23.2&&!window.__s87){window.__s87=1;
      var bw8=frames[1].contentWindow;
      var rj8='';try{rj8=bw8.localStorage.getItem('snake_rejoin')||'';}catch(e){}
      var m8=rj8.match(/"tryN":(\d+)/);
      slog('[SIM] B autoRejoin tryN='+(m8?m8[1]:'-1')+' rj='+rj8);
    }
    // ---- T40: 5秒长暂停(超过旧版5s socket超时), 验证暂停心跳+看门狗豁免+快照pz自愈 ----
    if(t>23.5&&!window.__s88){window.__s88=1;window.__dropBAll=false;
      frames[0].contentWindow.document.getElementById('pauseBtn').click();
      slog('[SIM] pause2 (5s 长暂停) tick='+frames[0].contentWindow.__G.tickN);}
    if(t>28.7&&!window.__s89){window.__s89=1;
      frames[0].contentWindow.document.getElementById('pauseBtn').click();
      slog('[SIM] resume2 tick='+frames[0].contentWindow.__G.tickN);}
    if(t>29.8&&!window.__s90){window.__s90=1;
      var bw9=frames[1].contentWindow,cw9=frames[2].contentWindow,aw9=frames[0].contentWindow;
      var rm=aw9.__G.remotes,aliveN=0,rmN=0;for(var rid in rm){rmN++;if(rm[rid].alive)aliveN++;}
      slog('[SIM] B pause2OK snapLive='+((bw9.__G.tickN-bw9.__G.LAN.lastSnapTick)<30?1:0)+' paused='+(bw9.__G.paused?1:0));
      slog('[SIM] B rejoined entered='+(bw9.__G.LAN.entered?1:0)+' alive='+(bw9.__G.player&&bw9.__G.player.alive?1:0)+' name='+(bw9.__G.player?bw9.__G.player.name:'-'));
      var r1=aw9.__G.remotes[1],r2=aw9.__G.remotes[2];
      slog('[SIM] uidmap B.ownUid='+bw9.__G.LAN.ownUid+' hostR1='+(r1?r1.uid+':'+r1.name:'-')+' hostR2='+(r2?r2.uid+':'+r2.name:'-'));
      slog('[SIM] C pause2OK snapLive='+((cw9.__G.tickN-cw9.__G.LAN.lastSnapTick)<30?1:0)+' paused='+(cw9.__G.paused?1:0));
      slog('[SIM] host remoteN='+rmN+' remoteAlive='+aliveN);
      slog('[SIM] B dbgTail='+bw9.__G.DBG.slice(-6).join(' | '));
      slog('[SIM] A dbgTail='+aw9.__G.DBG.slice(-6).join(' | '));
      slog('[SIM] C dbgTail='+cw9.__G.DBG.slice(-6).join(' | ')+' C tickN='+cw9.__G.tickN+' started='+(cw9.__G.LAN.entered?1:0));
      slog('[SIM] done');
    }
  }catch(e){slog('[SIM] err '+e.message+' | '+(e.stack||'').split('\n')[1]);}
  if(t<31.0)setTimeout(step,200);
}
setTimeout(step,500);
</script></body></html>
